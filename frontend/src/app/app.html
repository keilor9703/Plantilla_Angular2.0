<router-outlet></router-outlet>



<!-- UI TOAST -->
<div class="ui-toast-wrap" *ngIf="toast.open">
  <div class="ui-toast" [ngClass]="toast.type">
    <div class="ui-toast__icon">
      <i
        class="fa-solid"
        [ngClass]="{
          'fa-circle-check': toast.type === 'success',
          'fa-triangle-exclamation': toast.type === 'warning',
          'fa-circle-xmark': toast.type === 'error',
          'fa-circle-info': toast.type === 'info'
        }"
      ></i>
    </div>

    <div class="ui-toast__content">
      <div class="ui-toast__title">{{ toast.title }}</div>
      <div class="ui-toast__text">{{ toast.message }}</div>
    </div>

    <button class="ui-icon-btn ui-toast__close" type="button" (click)="hideToast()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</div>


<!-- ALERT MODAL (tipo SweetAlert / screenshot) -->
<div class="ui-alert" *ngIf="alert.open" (click)="closeAlert()">
  <div class="ui-alert__dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="ui-alert__icon" [ngClass]="alert.type">
      <i class="fa-solid"
         [ngClass]="{
           'fa-circle-check': alert.type === 'success',
           'fa-triangle-exclamation': alert.type === 'warning',
           'fa-circle-xmark': alert.type === 'error',
           'fa-circle-info': alert.type === 'info'
         }"></i>
    </div>

    <h3 class="ui-alert__title">{{ alert.title }}</h3>
    <p class="ui-alert__text">{{ alert.message }}</p>

    <div *ngIf="alert.isPrompt" class="ui-alert__prompt-wrap" style="margin: 15px 0; text-align: left;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ui-text, #333);">
        {{ alert.promptLabel || 'Motivo de la eliminación:' }}
      </label>
      <textarea
        [(ngModel)]="alert.promptValue"
        [placeholder]="alert.promptPlaceholder || 'Ingrese una observación o motivo...'"
        rows="3"
        style="width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; resize: vertical; box-sizing: border-box;"
      ></textarea>
    </div>

    <div class="ui-alert__foot" [ngClass]="alert.type">
      <button *ngIf="alert.isConfirm" class="ui-btn secondary" type="button" (click)="cancelAlert()">
        {{ alert.cancelText || 'Cancelar' }}
      </button>

      <button class="ui-btn primary ui-btn--fx" type="button" (click)="confirmAlert()">
        {{ alert.okText }}
      </button>
    </div>
  </div>
</div>
