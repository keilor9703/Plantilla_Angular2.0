services:
  reverse-proxy:
    build: ./reverse-proxy
    image: sicoe-reverse-proxy:latest
    container_name: sicoe-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - /var/proyectos/landing/html:/usr/share/nginx/landing:ro
    networks:
      - sicoe_default
      - sisinfo_default
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: sicoe-api:latest
    container_name: sicoe-api
    ports:
      - "8088:8088"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DbCoest=${DB_COEST}
      - AppSettings__UploadsPath=/app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/auth-test/cache-status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sicoe_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    image: sicoe-frontend:latest
    container_name: sicoe-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8091:80"
    restart: unless-stopped
    networks:
      - sicoe_default

networks:
  sicoe_default:
    name: sicoe_default
  sisinfo_default:
    name: sisinfo_default
    external: true

volumes:
  uploads:
