<div class="social-dock" [class.is-collapsed]="collapsed" aria-label="Dock de redes sociales">
  <button
    class="social-dock__toggle"
    type="button"
    (click)="toggleCollapsed()"
    [attr.aria-label]="collapsed ? 'Expandir redes sociales' : 'Contraer redes sociales'">
    <i class="fa-solid fa-comments"></i>
  </button>

  <div class="social-dock__list">
    <button
      type="button"
      class="social-dock__item"
      *ngFor="let group of groups"
      [style.--social-color]="group.color"
      [attr.aria-label]="'Abrir ' + group.networkName"
      (click)="openGroup(group)">
      <i [class]="'fa-brands ' + group.icon"></i>
      <span class="social-dock__label">{{ group.networkName }}</span>
    </button>
  </div>
</div>

<div class="social-dock__backdrop" *ngIf="panelOpen" (click)="closePanel()"></div>

<aside class="social-drawer" [class.is-open]="panelOpen" role="dialog" aria-modal="true" *ngIf="panelOpen">
  <header class="social-drawer__head">
    <div class="social-drawer__title">
      <i class="fa-solid fa-share-nodes"></i>
      {{ selectedGroup?.networkName || 'Red social' }}
    </div>
    <button class="social-drawer__close" type="button" aria-label="Cerrar panel" (click)="closePanel()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </header>

  <div class="social-drawer__body">
    <article class="social-account" *ngFor="let account of selectedGroup?.accounts ?? []">
      <div class="social-account__avatar">
        <img *ngIf="account.avatarUrl; else avatarFallback" [src]="account.avatarUrl" [alt]="account.accountName" />
        <ng-template #avatarFallback>
          <span>{{ (account.accountName || 'C').charAt(0).toUpperCase() }}</span>
        </ng-template>
      </div>
      <div class="social-account__meta">
        <div class="social-account__name-row">
          <strong>{{ account.accountName }}</strong>
          <span class="social-account__badge" *ngIf="(account.notifications ?? 0) > 0">{{ account.notifications }}</span>
        </div>
        <div class="social-account__handle">{{ getHandle(account) }}</div>
        <a [href]="account.url" target="_blank" rel="noopener noreferrer">Abrir perfil</a>
      </div>
    </article>
  </div>
</aside>
