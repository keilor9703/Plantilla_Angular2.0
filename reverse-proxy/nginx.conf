server {
  listen 80;
  server_name _;

  client_max_body_size 150m;
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  # ==========================================
  # LANDING PAGE (raíz)
  # ==========================================
  location / {
    root /usr/share/nginx/landing;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # ==========================================
  # TABLEAU - Tableros
  # ==========================================
  location = /tableros {
    return 301 /tableros/;
  }

  location /tableros/ {
    alias /usr/share/nginx/tableu/;
    index embed.html;
    try_files $uri $uri/ embed.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # ==========================================
  # SISGE/OFTIC - API (con prefijo /sicoe/)
  # ==========================================
  location /sicoe/api/ {
    proxy_pass http://sicoe-api:8088/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sicoe/uploads/ {
    proxy_pass http://sicoe-api:8088/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sicoe/ {
    proxy_pass http://sicoe-frontend:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sicoe {
    return 301 /sicoe/;
  }

  # ==========================================
  # SISGE - Imágenes directas (devueltas por API)
  # ==========================================
  location /api/Slider/ {
    proxy_pass http://sicoe-api:8088/api/Slider/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/Radio/ {
    proxy_pass http://sicoe-api:8088/api/Radio/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/PersonajeMesUpload/ {
    proxy_pass http://sicoe-api:8088/api/PersonajeMesUpload/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/LoginVisual/ {
    proxy_pass http://sicoe-api:8088/api/LoginVisual/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/Modal/ {
    proxy_pass http://sicoe-api:8088/api/Modal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/NoticiaUpload/ {
    proxy_pass http://sicoe-api:8088/api/NoticiaUpload/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/Branding/ {
    proxy_pass http://sicoe-api:8088/api/Branding/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/VideoUnidad/ {
    proxy_pass http://sicoe-api:8088/api/VideoUnidad/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/CuentaEmailUpload/ {
    proxy_pass http://sicoe-api:8088/api/CuentaEmailUpload/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/EventoUpload/ {
    proxy_pass http://sicoe-api:8088/api/EventoUpload/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://sicoe-api:8088/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /imagenes/ {
    proxy_pass http://sicoe-frontend:80/imagenes/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ==========================================
  # POLIRED - Portal (estáticos y API)
  # ==========================================
  # Assets estáticos del portal
  location /assets/ {
    proxy_pass http://portal_nginx:80/polired/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Storage de imágenes del portal
  location /storage/ {
    proxy_pass http://portal_nginx:80/polired/storage/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # SICOE content API (mayúscula tras /api/) → sicoe-api
  location ~ ^/polired/api/[A-Z] {
    rewrite ^/polired(/api/.*)$ $1 break;
    proxy_pass http://sicoe-api:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Portal SPA y API propia (minúscula tras /api/) → portal_nginx
  location /polired/ {
    proxy_pass http://portal_nginx:80/polired/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /polired {
    return 301 /polired/;
  }

  # API del portal (lo que no matchee rutas sicoe arriba)
  location /api/ {
    proxy_pass http://portal_backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
