server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 120m;
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  send_timeout 300s;

  # --- Security headers ---
  # Evita que el browser interprete archivos con MIME distinto al declarado
  add_header X-Content-Type-Options "nosniff" always;

  # Bloquea que la app sea embebida en iframes de otros dominios (clickjacking)
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Controla qué información de referencia se envía al navegar fuera del sitio
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Restringe permisos de APIs del navegador no usadas por la app
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Content Security Policy:
  #   - script/style/font/connect: solo mismo origen
  #   - img: mismo origen + data: (fotos en base64 de funcionarios)
  #   - media: mismo origen (videos institucionales)
  #   - frame-src: YouTube para videos embebidos (SafeUrlPipe)
  #   - unsafe-inline en style-src: necesario para Angular (estilos dinámicos)
  add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data:;
    media-src 'self';
    connect-src 'self';
    frame-src https://www.youtube.com https://www.youtube-nocookie.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " always;
  # -----------------------

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /api/ {
    proxy_pass http://api:8088/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/ {
    proxy_pass http://api:8088/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
