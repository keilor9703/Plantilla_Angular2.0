services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    image: sicoe-api:latest
    container_name: sicoe-api
    ports:
      - "8088:8088"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DbCoest=${DB_COEST}
      - AppSettings__UploadsPath=/app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/auth-test/cache-status"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    image: sicoe-frontend:latest
    container_name: sicoe-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8091:80"
    restart: unless-stopped

volumes:
  uploads:
