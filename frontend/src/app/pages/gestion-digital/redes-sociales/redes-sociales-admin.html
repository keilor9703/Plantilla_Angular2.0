<section class="redes-sociales-admin-page">
  <div class="ui-panel">

    <!-- Cabecera -->
    <div class="ui-panel__head">
      <div class="ui-panel__title">
        <i class="fa-solid fa-share-nodes"></i>
        Administración de Redes Sociales
      </div>
      <div class="ui-panel__actions ui-window-controls">
        <button class="ui-icon-btn ui-win-btn is-min" type="button" title="Minimizar" (click)="minimized = !minimized">
          <i class="fa-solid fa-minus"></i>
        </button>
      </div>
    </div>

    <div class="ui-panel__body" *ngIf="!minimized">
      <div class="admin-grid">

        <!-- Formulario -->
        <article class="tab-card form-card">
          <h3>{{ editingId ? 'Editar cuenta' : 'Nueva cuenta' }}</h3>

          <div class="ui-grid">

            <div class="ui-field ui-col-6">
              <label class="ui-label">Red Social *</label>
              <select class="ui-control" [(ngModel)]="form.redSocial">
                <option [ngValue]="null" disabled>Seleccionar red social</option>
                <option *ngFor="let d of dominios" [ngValue]="d.id ?? d.idDominio">{{ d.descripcion }}</option>
              </select>
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Unidad *</label>
              <select class="ui-control" [(ngModel)]="form.unidadResponsable">
                <option [ngValue]="null" disabled>Seleccionar unidad</option>
                <option *ngFor="let u of unidades" [ngValue]="u.value">{{ u.text }}</option>
              </select>
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Nombre de la cuenta *</label>
              <input class="ui-control" type="text" [(ngModel)]="form.nombreCuenta" maxlength="100"
                placeholder="Ej: @PoliciaColombia">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">URL *</label>
              <input class="ui-control" type="url" [(ngModel)]="form.urlCuenta" maxlength="500"
                placeholder="https://...">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Acta de asignación</label>
              <input class="ui-control" type="text" [(ngModel)]="form.actaAsignacion" maxlength="200"
                placeholder="Número o referencia del acta">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Nombre del responsable</label>
              <input class="ui-control" type="text" [(ngModel)]="form.nombreResponsable" maxlength="100"
                placeholder="Nombre completo">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Teléfono responsable</label>
              <input class="ui-control" type="text" [(ngModel)]="form.telResponsable" maxlength="50"
                placeholder="Teléfono del responsable">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Email responsable</label>
              <input class="ui-control" type="email" [(ngModel)]="form.emailResponsable" maxlength="150"
                placeholder="correo@dominio.com">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Email de la cuenta</label>
              <input class="ui-control" type="email" [(ngModel)]="form.emailCuenta" maxlength="150"
                placeholder="correoCuenta@dominio.com">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Teléfono asociado</label>
              <input class="ui-control" type="text" [(ngModel)]="form.telAsociado" maxlength="50"
                placeholder="Teléfono asociado a la cuenta">
            </div>

            <div class="ui-field ui-col-6">
              <label class="ui-label">Vigente</label>
              <select class="ui-control" [(ngModel)]="form.vigente">
                <option [ngValue]="1">Sí</option>
                <option [ngValue]="0">No</option>
              </select>
            </div>

          </div>

          <div class="tab-actions">
            <button class="ui-btn secondary" type="button" (click)="nuevo()">Limpiar</button>
            <button class="ui-btn primary" type="button" (click)="guardar()" [disabled]="saving">
              <i class="fa-solid fa-floppy-disk"></i>
              {{ saving ? 'Guardando...' : 'Guardar' }}
            </button>
          </div>
        </article>

        <!-- Listado -->
        <article class="tab-card list-card">
          <h3>Cuentas registradas</h3>

          <div class="list-loading" *ngIf="loading">Cargando cuentas...</div>

          <div class="redes-list" *ngIf="!loading && grupos.length > 0">
            <div class="redes-group" *ngFor="let grupo of grupos">
              <button class="redes-group__head" type="button" (click)="toggleGrupo(grupo)">
                <span class="redes-group__title">{{ grupo.redSocial }}</span>
                <span class="redes-group__count">{{ grupo.items.length }}</span>
                <i class="fa-solid fa-chevron-down redes-group__icon" [class.is-open]="grupo.expanded"></i>
              </button>

              <div class="redes-group__body" *ngIf="grupo.expanded">
                <div class="redes-item" *ngFor="let item of grupo.items">
                  <div class="redes-item__header">
                    <span class="redes-item__titulo">{{ item.nombreCuenta }}</span>
                  </div>

                  <div class="redes-item__meta">
                    <span><i class="fa-solid fa-link"></i> {{ item.urlCuenta }}</span>
                    <span><i class="fa-solid fa-building"></i> {{ item.unidadResponsable }}</span>
                    <span><i class="fa-solid fa-calendar-days"></i> {{ item.fechaCreacion | date:'dd/MM/yyyy' }}</span>
                  </div>

                  <div class="redes-item__actions">
                    <button class="ui-btn secondary" type="button" (click)="editar(item)">
                      <i class="fa-solid fa-pen"></i> Editar
                    </button>
                    <button class="ui-btn danger" type="button" (click)="eliminar(item)">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="news-state" *ngIf="!loading && grupos.length === 0">
            No hay cuentas registradas.
          </div>
        </article>

      </div>
    </div>
  </div>
</section>
